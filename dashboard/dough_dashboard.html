<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeOfFlightDough — Dough Monitor</title>
  <link rel="stylesheet" href="css/dashboard.css">

  <script type="importmap">
  {
    "imports": {
      "three":                                  "./js/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./js/vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>

  <header>
    <h1>&#x1F35E; TimeOfFlightDough</h1>
    <div id="connection-status" class="badge unknown">Loading…</div>
    <button id="reset-url-btn" title="Change ESPHome device URL">⚙</button>
  </header>

  <!-- ESPHome device URL prompt (shown once, saved to localStorage) -->
  <div id="connect-panel" class="hidden">
    <label>ESPHome Device URL
      <input type="text" id="esphome-url" placeholder="http://dough-monitor.local" />
    </label>
    <button id="connect-btn">Connect</button>
    <p class="hint">The URL of your ESP32 on the local network (check your router for its IP if mDNS doesn't work).</p>
  </div>

  <!-- Main dashboard -->
  <main id="dashboard" class="hidden">

    <section id="controls">
      <div class="control-group">
        <span class="label">Mode</span>
        <button id="mode-btn" class="active">Delta (Rise)</button>
        <button id="mode-raw-btn">Raw Distance</button>
      </div>
      <div class="control-group">
        <span class="label">View</span>
        <button id="view-3d-btn" class="active">3D Surface</button>
        <button id="view-heatmap-btn">Heatmap</button>
      </div>
      <div class="control-group">
        <span class="label">Scale</span>
        <input type="range" id="z-scale" min="0.5" max="10" step="0.5" value="3">
        <span id="z-scale-val">3×</span>
      </div>
      <div class="control-group">
        <span class="label">Smooth</span>
        <input type="range" id="smoothing" min="0.05" max="1.0" step="0.05" value="0.25">
        <span id="smoothing-val">0.25</span>
      </div>
      <div class="control-group">
        <span class="label">Calibrated</span>
        <span id="cal-badge" class="badge unknown">Unknown</span>
      </div>
    </section>

    <section id="viz-area">
      <canvas id="threejs-canvas"></canvas>
      <canvas id="heatmap-canvas" class="hidden"></canvas>
    </section>

    <section id="stats">
      <div class="stat"><span>Centre Distance</span><strong id="stat-centre">--</strong> mm</div>
      <div class="stat"><span>Max Rise (delta)</span><strong id="stat-max-delta">--</strong> mm</div>
      <div class="stat"><span>Last Update</span><strong id="stat-ts">--</strong></div>
      <div class="stat"><span>Mode</span><strong id="stat-mode">--</strong></div>
    </section>

  </main>

  <script type="module">
    import { DoughVisualizer } from './js/visualizer.js?v=5';
    import { ESPHomeSensor }   from './js/esphome_sse.js?v=1';

    const ESPHOME_KEY    = 'tof_esphome_url';
    const GRID_SENSOR_ID = 'text_sensor-grid_data';

    const statusBadge  = document.getElementById('connection-status');
    const connectPanel = document.getElementById('connect-panel');
    const dashboard    = document.getElementById('dashboard');
    const calBadge     = document.getElementById('cal-badge');

    // JS module loaded — update badge
    statusBadge.textContent = 'Connecting…';
    statusBadge.className   = 'badge connecting';

    let viz         = null;
    let displayMode = 'delta';

    // ------------------------------------------------------------------
    // Try to load saved ESPHome URL, otherwise show prompt
    // ------------------------------------------------------------------
    const savedUrl = localStorage.getItem(ESPHOME_KEY);
    if (savedUrl) {
      startESPHome(savedUrl);
    } else {
      showConnectPanel();
    }

    function showConnectPanel() {
      statusBadge.textContent = 'Setup needed';
      statusBadge.className   = 'badge unknown';
      connectPanel.classList.remove('hidden');

      const input = document.getElementById('esphome-url');
      const saved = localStorage.getItem(ESPHOME_KEY);
      if (saved) input.value = saved;

      document.getElementById('connect-btn').addEventListener('click', () => {
        const url = input.value.trim();
        if (!url) { alert('Please enter the ESPHome device URL.'); return; }
        localStorage.setItem(ESPHOME_KEY, url);
        connectPanel.classList.add('hidden');
        startESPHome(url);
      });
    }

    function startESPHome(url) {
      statusBadge.textContent = 'Connecting…';
      statusBadge.className   = 'badge connecting';

      const sse = new ESPHomeSensor(url);

      sse.onConnect = () => {
        statusBadge.textContent = 'Connected';
        statusBadge.className   = 'badge connected';
        connectPanel.classList.add('hidden');
        dashboard.classList.remove('hidden');

        // Only create viz once — SSE can reconnect and re-fire onConnect
        if (!viz) {
          requestAnimationFrame(() => {
            viz = new DoughVisualizer(
              document.getElementById('threejs-canvas'),
              document.getElementById('heatmap-canvas')
            );
            viz.setZScale(parseFloat(document.getElementById('z-scale').value));
          });
        }
      };

      sse.onDisconnect = () => {
        statusBadge.textContent = 'Disconnected';
        statusBadge.className   = 'badge disconnected';
      };

      sse.onState = (id, state) => {
        if (id === GRID_SENSOR_ID) onGridData(state);
      };

      sse.connect();
    }

    // ------------------------------------------------------------------
    // Grid data handler
    // ------------------------------------------------------------------
    function onGridData(state) {
      if (!state || state === 'unavailable' || state === 'unknown') return;
      let data;
      try { data = JSON.parse(state); }
      catch (e) { console.warn('Could not parse grid_data JSON:', e); return; }

      calBadge.textContent = data.cal_valid ? 'Valid' : 'None';
      calBadge.className   = 'badge ' + (data.cal_valid ? 'connected' : 'error');

      const res    = data.res || 8;
      const centre = Math.floor(res / 2) * res + Math.floor(res / 2);
      document.getElementById('stat-centre').textContent    = data.distances_mm?.[centre] ?? '--';
      document.getElementById('stat-max-delta').textContent = data.delta_mm ? Math.max(...data.delta_mm) : 0;
      document.getElementById('stat-ts').textContent        = data.ts ? new Date(data.ts * 1000).toLocaleTimeString() : '--';
      document.getElementById('stat-mode').textContent      = data.mode || '--';

      if (viz) {
        const values = displayMode === 'delta' && data.cal_valid
          ? data.delta_mm : data.distances_mm;
        viz.update(values, res, displayMode === 'delta');
      }
    }

    // ------------------------------------------------------------------
    // Control wire-up
    // ------------------------------------------------------------------
    document.getElementById('mode-btn').addEventListener('click', () => {
      displayMode = 'delta';
      document.getElementById('mode-btn').classList.add('active');
      document.getElementById('mode-raw-btn').classList.remove('active');
    });
    document.getElementById('mode-raw-btn').addEventListener('click', () => {
      displayMode = 'raw';
      document.getElementById('mode-raw-btn').classList.add('active');
      document.getElementById('mode-btn').classList.remove('active');
    });
    document.getElementById('view-3d-btn').addEventListener('click', () => {
      document.getElementById('threejs-canvas').classList.remove('hidden');
      document.getElementById('heatmap-canvas').classList.add('hidden');
      document.getElementById('view-3d-btn').classList.add('active');
      document.getElementById('view-heatmap-btn').classList.remove('active');
      if (viz) viz.setViewMode('3d');
    });
    document.getElementById('view-heatmap-btn').addEventListener('click', () => {
      document.getElementById('heatmap-canvas').classList.remove('hidden');
      document.getElementById('threejs-canvas').classList.add('hidden');
      document.getElementById('view-heatmap-btn').classList.add('active');
      document.getElementById('view-3d-btn').classList.remove('active');
      if (viz) viz.setViewMode('heatmap');
    });
    document.getElementById('smoothing').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('smoothing-val').textContent = v.toFixed(2);
      if (viz) viz.setSmoothing(v);
    });

    document.getElementById('reset-url-btn').addEventListener('click', () => {
      localStorage.removeItem(ESPHOME_KEY);
      location.reload();
    });

    document.getElementById('z-scale').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('z-scale-val').textContent = v + '×';
      if (viz) viz.setZScale(v);
    });
  </script>
</body>
</html>
